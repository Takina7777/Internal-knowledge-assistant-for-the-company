# 基础设施：Redis（Celery broker/缓存）+ Qdrant（可选，Phase 2 迁移目标）
# 用法：
#   docker compose up -d                # 只启动 Redis
#   docker compose --profile qdrant up -d   # 同时启动 Qdrant（向量库升级时用）
# 说明：name 固定为 ek，避免中文目录名导致 compose 项目名解析失败
name: ek
services:
  redis:
    image: redis:7-alpine
    container_name: ek-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ek-qdrant
    profiles: ["qdrant"]
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
